services:
  db:
    image: postgres:16-alpine
    container_name: crustcraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crustcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crustcraft_password}
      POSTGRES_DB: ${POSTGRES_DB:-crustcraft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crustcraft} -d ${POSTGRES_DB:-crustcraft}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crustcraft-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-crustcraft}:${POSTGRES_PASSWORD:-crustcraft_password}@db:5432/${POSTGRES_DB:-crustcraft}?schema=public"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-supersecret_admin_pass}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-supersecret_demo_pass}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: sh -c "npx prisma migrate deploy && npm run seed"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crustcraft-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-crustcraft}:${POSTGRES_PASSWORD:-crustcraft_password}@db:5432/${POSTGRES_DB:-crustcraft}?schema=public"
      PORT: ${PORT:-3000}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-crustcraft-dev-jwt-secret-replace-in-production-2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-supersecret_admin_pass}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-supersecret_demo_pass}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-3000}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
